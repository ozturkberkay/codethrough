name: E2E Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  e2e_test:
    name: E2E Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Turbo `--affected` needs the previous commit to diff against.
          fetch-depth: 2

      - name: Install Bun & dependencies
        uses: ./.github/actions/bun_install

      # Playwright shells out to Node; pin Node 22 to match `type_check.yml`.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright_install

      # One parametrized entrypoint over every app with e2e. Each app brings up
      # its own stack inside its `test:e2e`: the CLI via its Bun-server
      # webServer, landing via docker compose in its webServer (the runner has
      # docker available).
      - name: Run e2e
        run: bun run turbo run test:e2e --affected

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-reports
          path: |
            apps/cli/playwright-report/**
            apps/cli/test-results/**
            apps/landing/playwright-report/**
            apps/landing/test-results/**
          if-no-files-found: ignore
