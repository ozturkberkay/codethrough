name: Lint

on:
  workflow_call:
    inputs:
      ts:
        description: Lint TypeScript files
        type: boolean
        default: false
      shell:
        description: Lint shell scripts
        type: boolean
        default: false
      markdown:
        description: Lint markdown files
        type: boolean
        default: false
      astro:
        description: Run astro guards
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ts:
        type: boolean
        default: true
      shell:
        type: boolean
        default: true
      markdown:
        type: boolean
        default: true
      astro:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ts_lint:
    name: TypeScript Lint
    if: inputs.ts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Turbo `--affected` needs the previous commit to diff against.
          fetch-depth: 2

      - name: Install Bun & dependencies
        uses: ./.github/actions/bun_install

      - name: Turbo lint
        run: bun run turbo run lint --affected

      - name: Turbo format:check
        run: bun run turbo run format:check --affected

      - name: Turbo lint:css
        run: bun run turbo run lint:css --affected

  shell_lint:
    name: Shell Lint
    if: inputs.shell
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Shellcheck
        shell: bash
        run: |
          shopt -s globstar
          shellcheck -x -- **/scripts/**/*.sh

  markdown_lint:
    name: Markdown Lint
    if: inputs.markdown
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Globs and ignores come from `.markdownlint-cli2.jsonc` (auto-discovered).
      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd  # v23.2.0

  lychee:
    name: Lychee
    if: inputs.markdown
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0
        with:
          args: --config .lychee.toml --no-progress .

  astro_guards:
    name: Astro Guards
    if: inputs.astro
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # `forbid_is_inline.sh` expects files as argv; `forbid_raw_raster_img.sh`
      # scans the tree itself.
      - name: Forbid is:inline
        run: |
          find apps/landing -type f -name '*.astro' \
            -exec scripts/src/git_hooks/forbid_is_inline.sh {} +

      - name: Forbid raw raster <img>
        run: scripts/src/git_hooks/forbid_raw_raster_img.sh
