name: Type Check

on:
  workflow_call:
    inputs:
      ts:
        description: Type-check TypeScript packages
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ts:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  type_check:
    name: Type Check
    if: inputs.ts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Turbo `--affected` needs the previous commit to diff against.
          fetch-depth: 2

      # `astro check` shells out via Node and enforces Node >= 22.12.
      # `ubuntu-24.04-arm` ships Node 20 by default.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install Bun & dependencies
        uses: ./.github/actions/bun_install

      - name: Turbo check
        run: bun run turbo run check --affected
